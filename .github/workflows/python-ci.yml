name: Python CI

on: [pull_request]

permissions:
  contents: read

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Lint and test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Install backend dependencies
        run: poetry install --no-root --no-interaction
      - name: Lint Python packages
        run: poetry run ruff check --output-format=github app tests
      - name: Run pytest
        run: poetry run python -m pytest tests -q -p no:cacheprovider


  adr:
    name: Validate OpenAPI against ADR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install backend dependencies
        run: poetry install --no-root --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate OpenAPI specification
        run: >-
          poetry run python -c "from fastapi.testclient import TestClient;
          from app.main import app;
          print(TestClient(app).get('/v1/openapi.json').text)" > openapi.json

      - name: Validate API Design Rules
        run: |
          npx --yes @developer-overheid-nl/don-checker@1.3.1 \
            validate \
            --standard adr \
            --version 2.2.0 \
            --input openapi.json
