services:
  backend:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    environment:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    command:
      - sh
      - -c
      - python -m pip install --no-cache-dir poetry==2.5.1 &&
        poetry install --only main --no-root --no-interaction &&
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/openapi.json')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_venv:
  frontend_node_modules:
