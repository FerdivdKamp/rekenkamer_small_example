[project]
name = "backend"
version = "0.1.0"
description = "Simple backend example"
authors = [
    {name = "Ferdi van de Kamp",email = "ferdivdkamp@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]
